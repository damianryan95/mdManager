name: Release

# Publish a Docker image to GHCR on every GitHub Release, then update the
# deployment YAML on `main` to point at the newly released tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build (defaults to the release tag)"
        required: false

permissions:
  contents: write   # push the YAML update commit back to main
  packages: write   # push the image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env so the redeploy step can be conditionally skipped
    # (secrets can't be referenced directly in step `if:` conditions).
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name and tag
        id: meta
        run: |
          # GHCR requires a lowercase path (owner/repo)
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag available (not a release and no manual tag input)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point deployment YAML at the new image tag
        run: |
          set -euo pipefail
          IMAGE="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

          # Work from the tip of main (the release may be built from a tag)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          for f in portainer-stack.yml docker-compose.yml; do
            [ -f "$f" ] || continue
            # Replace the (single) mdviewer image: line, preserving indentation
            sed -i -E "s|^([[:space:]]*image:[[:space:]]).*|\1${IMAGE}|" "$f"
          done

          git add portainer-stack.yml docker-compose.yml
          if git diff --cached --quiet; then
            echo "No YAML changes to commit."
          else
            git commit -m "ci: deploy ${{ steps.meta.outputs.tag }} -> ${IMAGE} [skip ci]"
            git push origin main
          fi

      - name: Trigger Portainer redeploy
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          echo "POSTing to Portainer redeploy webhook..."
          # Portainer re-pulls the updated stack/image and redeploys. No body needed.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$PORTAINER_WEBHOOK_URL" --max-time 60 --retry 2)
          echo "Webhook responded HTTP $code"
          case "$code" in
            2*) echo "Portainer redeploy triggered." ;;
            *) echo "::error::Portainer redeploy webhook failed (HTTP $code)"; exit 1 ;;
          esac

      - name: Note if redeploy webhook not configured
        if: ${{ env.PORTAINER_WEBHOOK_URL == '' }}
        run: echo "::notice::PORTAINER_WEBHOOK_URL secret not set — skipped auto-redeploy. Add it to enable one-click rollout."

      - name: Summary
        run: |
          {
            echo "### Released \`${{ steps.meta.outputs.tag }}\` :rocket:"
            echo ""
            echo "**Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "Also tagged \`:latest\`. Deployment YAML on \`main\` updated."
          } >> "$GITHUB_STEP_SUMMARY"
